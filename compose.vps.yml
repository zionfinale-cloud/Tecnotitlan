services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CLIENT_URL_PRIMARY: ${CLIENT_URL_PRIMARY}
      SEO_SITE_URL: ${SEO_SITE_URL:-https://www.tecnotitlan.com.mx}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-disabled}
      WHATSAPP_ADMIN_GROUP_JID: ${WHATSAPP_ADMIN_GROUP_JID:-}
      WHATSAPP_CLOUD_PHONE_NUMBER_ID: ${WHATSAPP_CLOUD_PHONE_NUMBER_ID:-}
      WHATSAPP_CLOUD_ACCESS_TOKEN: ${WHATSAPP_CLOUD_ACCESS_TOKEN:-}
      WHATSAPP_CLOUD_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_CLOUD_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_CLOUD_APP_SECRET: ${WHATSAPP_CLOUD_APP_SECRET:-}
      WHATSAPP_CLOUD_API_VERSION: ${WHATSAPP_CLOUD_API_VERSION:-v23.0}
      CLIENT_URL_SECONDARY: ${CLIENT_URL_SECONDARY}
      UPLOAD_STRATEGY: ${UPLOAD_STRATEGY:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      MERCADOLIBRE_APP_ID: ${MERCADOLIBRE_APP_ID}
      MERCADOLIBRE_CLIENT_SECRET: ${MERCADOLIBRE_CLIENT_SECRET}
      MERCADOLIBRE_REDIRECT_URI: ${MERCADOLIBRE_REDIRECT_URI}
      N8N_ORDER_WEBHOOK_URL: ${N8N_ORDER_WEBHOOK_URL}
      N8N_SUPPORT_WEBHOOK_URL: ${N8N_SUPPORT_WEBHOOK_URL}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      APP_RELEASE: ${APP_RELEASE:-}
    volumes:
      - tecnotitlan_uploads:/app/uploads
      - tecnotitlan_whatsapp_auth:/app/auth_info_baileys
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_PAYPAL_CLIENT_ID: ${REACT_APP_PAYPAL_CLIENT_ID}
        REACT_APP_MERCADOLIBRE_APP_ID: ${REACT_APP_MERCADOLIBRE_APP_ID}
        REACT_APP_MERCADOLIBRE_REDIRECT_URI: ${REACT_APP_MERCADOLIBRE_REDIRECT_URI}
        REACT_APP_RECAPTCHA_SITE_KEY: ${REACT_APP_RECAPTCHA_SITE_KEY}
        REACT_APP_SENTRY_DSN: ${REACT_APP_SENTRY_DSN:-}
        REACT_APP_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        REACT_APP_SENTRY_TRACES_SAMPLE_RATE: ${REACT_APP_SENTRY_TRACES_SAMPLE_RATE:-0.05}
        REACT_APP_RELEASE: ${REACT_APP_RELEASE:-}
        REACT_APP_SITE_URL: ${REACT_APP_SITE_URL:-https://www.tecnotitlan.com.mx}
        GENERATE_SOURCEMAP: "false"
    environment:
      REACT_APP_SENTRY_DSN: ${REACT_APP_SENTRY_DSN:-}
      REACT_APP_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      REACT_APP_SENTRY_TRACES_SAMPLE_RATE: ${REACT_APP_SENTRY_TRACES_SAMPLE_RATE:-0.05}
      REACT_APP_RELEASE: ${REACT_APP_RELEASE:-}
      REACT_APP_SITE_URL: ${REACT_APP_SITE_URL:-https://www.tecnotitlan.com.mx}
    restart: unless-stopped
    ports:
      - "3000:80"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - tecnotitlan_n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

volumes:
  tecnotitlan_uploads:
  tecnotitlan_whatsapp_auth:
  tecnotitlan_n8n_data:
